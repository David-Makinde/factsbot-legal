<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorisation code</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;line-height:1.6}
code{display:block;word-break:break-all;background:#f2f2f2;padding:1rem;border-radius:8px}</style></head>
<body>
<h1>Authorisation code</h1>
<p>Copy the text below and paste it into the terminal where tools/tiktok_auth.py is waiting.</p>
<code id="out">No code found in this address.</code>
<script>
  var p = new URLSearchParams(location.search);
  if (p.get("code")) document.getElementById("out").textContent = p.get("code");
  else if (p.get("error")) document.getElementById("out").textContent = "Error: " + p.get("error");
</script>
</body></html>
